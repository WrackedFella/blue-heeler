name: Deploy

# On every push to main: run the CI gate, then build the image and roll the Container App
# onto it. Triggered only by pushes to this repository's main branch (never by pull
# requests), because this job holds the Azure login and production configuration.
# One-time setup (Azure identity, variables, Container App) is in docs/runbooks/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/blue-heeler
      APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "image=${IMAGE,,}:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      # Actions that receive credentials are pinned to a commit.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"
      # OpenID Connect federation: no Azure secret is stored in GitHub.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az containerapp update --name "$APP" --resource-group "$RG" --image "${{ steps.tag.outputs.image }}"
      # Poll the new revision itself: the app's URL keeps serving the old revision until
      # the new one is healthy, so a crashing image would otherwise look like a success.
      - name: Wait for the new revision to become healthy
        run: |
          revision="$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)"
          for attempt in $(seq 1 30); do
            read -r health running < <(az containerapp revision show -n "$APP" -g "$RG" --revision "$revision" \
              --query "[properties.healthState, properties.runningState]" -o tsv | tr '\n' ' ')
            echo "$revision: health=$health running=$running"
            if [ "$health" = "Healthy" ]; then exit 0; fi
            if [ "$health" = "Unhealthy" ] || [ "$running" = "Failed" ]; then break; fi
            sleep 10
          done
          echo "::error::Revision $revision did not become healthy; the previous revision is still serving."
          exit 1
